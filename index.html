<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-full flex flex-col justify-between overflow-x-hidden antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Glowing background effects -->
    <div class="fixed inset-0 -z-10 flex items-center justify-center overflow-hidden pointer-events-none">
        <div class="w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-indigo-600/20 rounded-full blur-[120px] absolute -top-10 -left-10 sm:-top-20 sm:-left-20"></div>
        <div class="w-[250px] h-[250px] sm:w-[500px] sm:h-[500px] bg-purple-600/15 rounded-full blur-[100px] absolute -bottom-10 -right-10 sm:-bottom-20 sm:-right-20"></div>
    </div>

    <!-- Header / Navbar Minimalist -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <a href="#" class="flex items-center gap-2 text-xl font-bold tracking-tight text-white hover:opacity-80 transition-opacity">
            <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-sm">✦</span>
            <span>Brand</span>
        </a>
        <a style="display: none;" href="/" class="text-sm text-slate-400 hover:text-white transition-colors">
            Contact Support &rarr;
        </a>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-3xl mx-auto px-6 py-12 text-center my-auto flex flex-col items-center">
        
        <!-- Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wide uppercase mb-6 backdrop-blur-sm">
            <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
            Error 404
        </div>

        <!-- Giant 404 Graphic/Text -->
        <h1 class="text-7xl sm:text-9xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-200 to-slate-600 mb-4 select-none">
            404
        </h1>

        <!-- Title -->
        <h2 class="text-2xl sm:text-4xl font-bold tracking-tight text-white mb-4">
            Lost in cyberspace?
        </h2>

        <!-- Description -->
        <p class="text-base sm:text-lg text-slate-400 max-w-md mx-auto mb-8 leading-relaxed">
            The page you are looking for doesn’t exist or has been moved. Don't worry, you can easily find your way back home.
        </p>

        <!-- Actions / Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full sm:w-auto">
            <a style="display: none;" href="/" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/25 hover:bg-indigo-500 hover:shadow-indigo-500/35 active:scale-95 transition-all duration-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Back to Homepage
            </a>

            <button style="display: none;" onclick="history.back()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-semibold hover:bg-slate-800 hover:text-white active:scale-95 transition-all duration-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Go Back
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs text-slate-500">
        &copy; 2026 Your Company Inc. All rights reserved.
    </footer>

</body>
</html>
